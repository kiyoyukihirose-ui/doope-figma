<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="DOOPE ショッピングカート">
  <title>CART — DOOPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cart.css?v=20260916-1">
  <script src="script.js?v=20260916-5" defer></script>
</head>
<body class="cart-page">
  <div class="cart-shell">
    <header class="cart-header">
      <a href="index.html" aria-label="DOOPEトップへ戻る">
        <img src="assets/lp-imgGroup4.svg" alt="DOOPE" width="214" height="112">
      </a>
      <span>ONLINE STORE</span>
    </header>

    <main class="cart-main" data-cart>
      <p class="cart-kicker">YOUR CART</p>
      <h1>CART</h1>
      <div class="cart-heading-rule" aria-hidden="true"></div>

      <section class="cart-items" aria-label="カート内の商品">
        <article class="cart-item" data-cart-item="half" hidden>
          <div class="cart-item__image"><img src="assets/buy-product-main.png" alt="DOOPE #1"></div>
          <div class="cart-item__body">
            <p class="cart-item__name">DOOPE #1</p>
            <p class="cart-item__size">MANGO / 0.5ml</p>
            <p class="cart-item__unit">¥7,800</p>
            <div class="cart-item__controls">
              <label>数量
                <select data-cart-quantity aria-label="DOOPE #1 0.5mlの数量">
                  <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                </select>
              </label>
              <button type="button" data-cart-remove>削除</button>
            </div>
            <p class="cart-item__line-total" data-cart-line-total>¥0</p>
          </div>
        </article>

        <article class="cart-item" data-cart-item="full" hidden>
          <div class="cart-item__image"><img src="assets/buy-product-main.png" alt="DOOPE #1"></div>
          <div class="cart-item__body">
            <p class="cart-item__name">DOOPE #1</p>
            <p class="cart-item__size">MANGO / 1.0ml</p>
            <p class="cart-item__unit">¥16,800</p>
            <div class="cart-item__controls">
              <label>数量
                <select data-cart-quantity aria-label="DOOPE #1 1mlの数量">
                  <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                </select>
              </label>
              <button type="button" data-cart-remove>削除</button>
            </div>
            <p class="cart-item__line-total" data-cart-line-total>¥0</p>
          </div>
        </article>
      </section>

      <section class="cart-empty" data-cart-empty>
        <p>カートは空です。</p>
        <a href="buy.html">商品を見る</a>
      </section>

      <section class="cart-summary" data-cart-summary hidden>
        <div class="cart-summary__row"><span>商品数</span><strong data-cart-count>0点</strong></div>
        <div class="cart-summary__row cart-summary__total"><span>TOTAL</span><strong data-cart-total>¥0</strong></div>
        <p class="cart-summary__note">送料・振込手数料は購入手続き画面でご確認ください。</p>
        <button class="cart-checkout" type="button" data-checkout>購入手続きへ</button>
        <a class="cart-continue" href="buy.html">← 買い物を続ける</a>
      </section>

      <p class="cart-status" data-cart-status role="status" aria-live="polite"></p>
    </main>

    <footer class="cart-footer">
      <img src="assets/lp-imgGroup4.svg" alt="DOOPE" width="214" height="112">
      <p>CHILL YOUR LIFE.</p>
    </footer>
  </div>
</body>
</html>
